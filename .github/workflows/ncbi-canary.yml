name: NCBI remote-BLAST canary

# Early-warning check for backend/scripts/ncbi_canary.py -- see that
# script's own docstring. Submits a tiny, known-good query to NCBI's real
# Blast.cgi and verifies app.pipeline.ncbi_remote can still submit, poll,
# and parse a result. A failure here means NCBI changed something before
# any real analyst's run hit it.
on:
  schedule:
    # 07:00 UTC daily -- off business hours everywhere this app is used,
    # frequent enough to catch drift within a day.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run the NCBI canary
        working-directory: backend
        run: python scripts/ncbi_canary.py
